# Render blueprint for the LookOut API.
#
# NOTE ON SCOPE: this deploys the API and database ONLY. The detection watchers
# (watch_parking, watch_curfew, ...) are not here and cannot be - they read RTSP
# streams from cameras on the barangay LAN, which no datacentre can reach, and
# their CV stack is several GB. They run on a PC beside the cameras, pointed at
# this service's DATABASE_URL. See DEPLOYMENT.md.
services:
  - type: web
    name: lookout-api
    runtime: python
    plan: free
    rootDir: lookout_backend
    # One script rather than four inline lines, so the same sequence can be run
    # by hand and so `set -o errexit` applies: an inline block carries on after
    # a failed step, which once let a deploy go live with no migrations.
    buildCommand: ./build.sh
    startCommand: gunicorn lookout_backend.wsgi:application --workers 2 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true          # Render creates a strong key
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false                  # set to your Render hostname
      - key: CORS_ALLOWED_ORIGINS
        sync: false                  # your dashboard origin
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: lookout-db
          property: connectionString
      # First admin on an empty database. `migrate` creates tables, not rows,
      # and Render's free tier has no shell to run createsuperuser from. The
      # command is idempotent and skips itself when these are unset, so clear
      # them once the account exists and the password has been changed.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # This server has no GPU, no model weights and no camera, so it must
      # refuse to launch a detector. Without it a detection job is accepted,
      # the subprocess dies on a missing .pt file, and the page sits on
      # "processing" for ever with the reason in a log nobody opens.
      - key: DETECTION_ENABLED
        value: "False"
      # Evidence media. Cloudinary is checked first and is NOT S3-compatible,
      # so it needs its own backend; the AWS_* block below is the alternative,
      # not a companion. Set one or the other, never both.
      - key: CLOUDINARY_URL
        sync: false
      # Evidence bucket (S3/R2/B2) - the alternative to Cloudinary above,
      # required so the on-site watchers and this API read and write the SAME
      # files. Leave both unset only for a local trial.
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false
      # Email (OTP codes) and SMS - see .env.example
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SEMAPHORE_API_KEY
        sync: false

databases:
  - name: lookout-db
    plan: free
    databaseName: lookout
