# Render blueprint for the LookOut API.
#
# NOTE ON SCOPE: this service runs the API, the database AND the detectors.
#
# The detectors need two things a datacentre does not have: the camera, which
# sits on the barangay LAN, and Ollama for the VLM check. Both are reached
# through tunnels from the PC on site -- STREAM_URL/the camera's stream URL for
# the RTSP stream, VLM_ENDPOINT for Ollama. That PC therefore still has to be
# on; it just runs the tunnels and Ollama instead of the detectors.
#
# The cheaper topology is the reverse: detectors on the PC beside the camera,
# this service API-only. To go back to it, set DETECTION_ENABLED=False and
# INSTALL_DETECTION=false (which skips the ~0.5GB torch install at build) and
# drop the plan back to free.
services:
  - type: web
    name: lookout-api
    runtime: python
    # NOT free: torch plus a loaded YOLO model and OpenCV video decode do not
    # fit in the free tier's 512MB, and a free instance spins down after 15
    # minutes idle, which kills the live monitor. Standard is 2GB.
    plan: standard
    rootDir: lookout_backend
    # One script rather than four inline lines, so the same sequence can be run
    # by hand and so `set -o errexit` applies: an inline block carries on after
    # a failed step, which once let a deploy go live with no migrations.
    buildCommand: ./build.sh
    # ONE worker. Each worker is a separate process with its own copy of the
    # loaded YOLO weights, and its own live-monitor thread -- two of them race
    # to spawn the same detector subprocesses and double the memory.
    startCommand: gunicorn lookout_backend.wsgi:application --workers 1 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true          # Render creates a strong key
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false                  # set to your Render hostname
      - key: CORS_ALLOWED_ORIGINS
        sync: false                  # your dashboard origin
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: lookout-db
          property: connectionString
      # First admin on an empty database. `migrate` creates tables, not rows,
      # and Render's free tier has no shell to run createsuperuser from. The
      # command is idempotent and skips itself when these are unset, so clear
      # them once the account exists and the password has been changed.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # This service runs the detectors. The weights ship in the repo
      # (core/vision/*.pt, 54MB), the CV stack is installed by build.sh, and
      # the camera and Ollama arrive over tunnels (below). Set this False
      # together with INSTALL_DETECTION=false to go back to an API-only host.
      - key: DETECTION_ENABLED
        value: "True"
      # Whether build.sh installs torch/ultralytics. Must agree with
      # DETECTION_ENABLED: True here with a False install gives a service that
      # accepts a detection job and dies on `import torch`.
      - key: INSTALL_DETECTION
        value: "true"
      # Where this service reaches Ollama for the VLM check -- the ngrok HTTP
      # tunnel fronting the on-site PC's Ollama. Overrides the stored
      # SystemSettings.vlm_endpoint, which says localhost and is correct only
      # on that PC. Ollama binds 127.0.0.1 and checks the Host header, so the
      # tunnel needs OLLAMA_HOST=0.0.0.0:11434 and --host-header=rewrite.
      - key: VLM_ENDPOINT
        sync: false
      # OPTIONAL, and usually better left unset: the camera's RTSP address.
      #
      # On a free ngrok plan the TCP address changes every restart, and
      # changing an env var here triggers a full redeploy. The camera's
      # stream URL is also settable from the dashboard (Live Feeds -> Stream
      # URL), which takes effect immediately and takes priority over this --
      # see Camera.resolved_stream_url. Use that for the rotating address and
      # leave this unset.
      - key: STREAM_URL
        sync: false
      # Evidence media. Cloudinary is checked first and is NOT S3-compatible,
      # so it needs its own backend; the AWS_* block below is the alternative,
      # not a companion. Set one or the other, never both.
      - key: CLOUDINARY_URL
        sync: false
      # Evidence bucket (S3/R2/B2) - the alternative to Cloudinary above,
      # required so the on-site watchers and this API read and write the SAME
      # files. Leave both unset only for a local trial.
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false
      # Email (OTP codes), sent through Brevo's HTTP API rather than SMTP --
      # managed hosts block outbound SMTP ports. See core/mail.py and
      # .env.example. The EMAIL_HOST_* pair is only needed if EMAIL_BACKEND is
      # pointed back at Django's SMTP backend, and needs a DIFFERENT credential
      # (an SMTP key, not this API key).
      - key: BREVO_API_KEY
        sync: false
      # Must be an address verified under Brevo -> Senders, or Brevo accepts
      # the message and drops it.
      - key: DEFAULT_FROM_EMAIL
        sync: false

databases:
  - name: lookout-db
    plan: free
    databaseName: lookout
